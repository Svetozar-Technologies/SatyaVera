[package]
name = "satyavera-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transactional storage layer for SatyaVera. Wraps the link-cli library and appends every mutation to a separate journal file so the database can be reconstructed from the journal alone."
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Wire the transactional layer to the link-cli crate. Off by default so the
# transactional contract can be exercised in CI without pulling the full
# link-cli dependency tree.
link-cli = ["dep:link-cli"]

[dependencies]
thiserror = "2"
link-cli = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
